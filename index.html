**Rivalutazione annuale:**
1,5% fisso + 75% dell'inflazione ISTAT

- Stipendio mensile lordo: €2.000
- RAL (×13,5): €27.000
- Quota TFR annua: €27.000 ÷ 13,5 = **€2.000/anno**
- Dopo 10 anni ≈ €20.000 + rivalutazione

**Tassazione:**
Il TFR è soggetto a **tassazione separata** (non si somma al reddito ordinario), con aliquota media dei 5 anni precedenti.

**Destinazione:**
- 🏢 Lasciato in azienda (rischio in caso di fallimento)
